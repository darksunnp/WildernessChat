<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildernessChat</title>
</head>
<body>
    <textarea id="paste" rows="8" cols="60"></textarea>
    <div>
        <button id="offerBtn">Create offer</button>
        <button id="answerBtn">Create answer</button>
        <button id="acceptBtn">Accept answer</button>
    </div>


    <div id="log"></div>
    <input id="msgInput" placeholder="Enter your message">
    <button id="sendBtn">Send</button>


    <script src="peer.js"></script>
    <script src="app.js"></script>
</body>
</html>
